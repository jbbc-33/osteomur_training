<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#063DA8">
  <title>Nueva contraseña · OSTEOMUR Training</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <img class="logo-mark" src="/logo.png" alt="OSTEOMUR Training">
        <h1>OSTEOMUR Training</h1>
        <p>Recuperación de cuenta</p>
      </div>

      <div class="error-box" id="error-box"></div>

      <div id="reset-form-wrap">
        <h2 style="font-size:18px;margin:0 0 6px;color:var(--primary-dark);">Crea una contraseña nueva</h2>
        <p class="muted small" style="margin-top:0;">Al guardarla, todas las contraseñas anteriores dejarán de funcionar.</p>
        <form id="form-reset">
          <div class="field">
            <label for="reset-password">Nueva contraseña (mín. 8)</label>
            <input id="reset-password" type="password" required minlength="8" autocomplete="new-password" placeholder="••••••••">
          </div>
          <div class="field">
            <label for="reset-repeat">Repetir contraseña</label>
            <input id="reset-repeat" type="password" required minlength="8" autocomplete="new-password" placeholder="••••••••">
          </div>
          <button class="btn btn-primary btn-block btn-lg" type="submit" id="reset-submit">Guardar contraseña</button>
        </form>
        <button type="button" class="auth-link" id="link-login">Volver a iniciar sesión</button>
      </div>

      <div id="reset-done" style="display:none;">
        <h2 style="font-size:18px;margin:0 0 6px;color:var(--primary-dark);">Contraseña actualizada</h2>
        <p class="muted small">Ya puedes iniciar sesión con tu nueva contraseña. Te hemos enviado un correo de confirmación.</p>
        <a class="btn btn-primary btn-block btn-lg" href="/index.html">Iniciar sesión</a>
      </div>
    </div>
  </div>

  <script src="/js/app-config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/reset-password.js"></script>
  <script src="/js/native.js"></script>
</body>
</html>
